<!DOCTYPE html>
<!-- ==========================================================================
     APPLICATION — STEP 2: FAMILY & CONTACT DETAILS
     ========================================================================== -->
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Application: Family &amp; Contact</title>
  <?!= include('Stylesheet') ?>
</head>
<body>
  <script>const BASE_URL = '<?= baseUrl ?>';</script>

  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">
        <p class="eyebrow">Hostel Application &middot; Step 2 of 6</p>
        <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Family &amp; Contact Details</h1>

        <div id="step-nav" class="step-nav"></div>
        <div id="alert-root"></div>

        <form id="step-form" class="panel" novalidate>
          <div class="field-row">
            <div class="field" id="field-fatherName">
              <label class="field__label" for="fatherName">Father's Name <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="fatherName">
              <p class="field__error"></p>
            </div>
            <div class="field" id="field-motherName">
              <label class="field__label" for="motherName">Mother's Name <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="motherName">
              <p class="field__error"></p>
            </div>
          </div>

          <div class="subgroup">
            <p class="subgroup__title">Present Address — Residence</p>
            <div class="field" id="field-resAddress">
              <label class="field__label" for="resAddress">Address <span class="field__tag field__tag--required">Required</span></label>
              <textarea class="field__control" id="resAddress" rows="2"></textarea>
              <p class="field__error"></p>
            </div>
            <div class="field-row">
              <div class="field" id="field-resTel">
                <label class="field__label" for="resTel">Tel. No. <span class="field__tag field__tag--required">Required</span></label>
                <input class="field__control" type="tel" id="resTel">
                <p class="field__error"></p>
              </div>
              <div class="field" id="field-resEmail">
                <label class="field__label" for="resEmail">Email <span class="field__tag field__tag--required">Required</span></label>
                <input class="field__control" type="email" id="resEmail">
                <p class="field__error"></p>
              </div>
            </div>
          </div>

          <div class="subgroup">
            <p class="subgroup__title">Present Address — Office</p>
            <div class="field">
              <label class="field__label" for="officeAddress">Address <span class="field__tag field__tag--optional">Optional</span></label>
              <textarea class="field__control" id="officeAddress" rows="2"></textarea>
            </div>
            <div class="field-row">
              <div class="field">
                <label class="field__label" for="officeTel">Tel. No. <span class="field__tag field__tag--optional">Optional</span></label>
                <input class="field__control" type="tel" id="officeTel">
              </div>
              <div class="field">
                <label class="field__label" for="officeEmail">Email <span class="field__tag field__tag--optional">Optional</span></label>
                <input class="field__control" type="email" id="officeEmail">
              </div>
            </div>
          </div>

          <div class="field-row">
            <div class="field" id="field-studentMobile">
              <label class="field__label" for="studentMobile">Your Mobile Number <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="tel" id="studentMobile" inputmode="numeric" placeholder="10-digit number">
              <p class="field__error"></p>
            </div>
            <div class="field" id="field-studentEmail">
              <label class="field__label" for="studentEmail">Your Email <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="email" id="studentEmail">
              <p class="field__error"></p>
            </div>
          </div>

          <div class="field" id="field-emergencyAddress">
            <label class="field__label" for="emergencyAddress">Emergency Contact Address <span class="field__tag field__tag--required">Required</span></label>
            <textarea class="field__control" id="emergencyAddress" rows="2"></textarea>
            <p class="field__help">Who should the hostel reach first in an emergency, and where.</p>
            <p class="field__error"></p>
          </div>

          <div class="field-row">
            <div class="field" id="field-emergencyTel">
              <label class="field__label" for="emergencyTel">Emergency Contact Tel. No. <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="tel" id="emergencyTel">
              <p class="field__error"></p>
            </div>
            <div></div>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn--secondary" id="back-btn">Back</button>
            <button type="submit" class="btn btn--primary" id="next-btn">Next: Local Guardian Details</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <?!= include('JavaScript') ?>
  <script>
    const student = requireSession();
    let draft;
    if (student) {
      if (student.hasExistingApplication) window.top.location.href = pageUrl('status');
      draft = requireDraft();
    }

    if (student && draft) {
      renderSiteHeader(document.getElementById('site-header'), { activeNav: 'apply' });
      renderSiteFooter(document.getElementById('site-footer'));
      renderStepNav(document.getElementById('step-nav'), 'family');

      document.getElementById('fatherName').value = draft.fatherName ?? '';
      document.getElementById('motherName').value = draft.motherName ?? '';
      document.getElementById('resAddress').value = draft.residenceAddress?.address ?? '';
      document.getElementById('resTel').value = draft.residenceAddress?.tel ?? '';
      document.getElementById('resEmail').value = draft.residenceAddress?.email ?? '';
      document.getElementById('officeAddress').value = draft.officeAddress?.address ?? '';
      document.getElementById('officeTel').value = draft.officeAddress?.tel ?? '';
      document.getElementById('officeEmail').value = draft.officeAddress?.email ?? '';
      document.getElementById('studentMobile').value = draft.studentMobile ?? '';
      document.getElementById('studentEmail').value = draft.studentEmail ?? '';
      document.getElementById('emergencyAddress').value = draft.emergencyAddress ?? '';
      document.getElementById('emergencyTel').value = draft.emergencyTel ?? '';
    }

    const REQUIRED_FIELDS = [
      { id: 'fatherName' },
      { id: 'motherName' },
      { id: 'resAddress' },
      { id: 'resTel' },
      { id: 'resEmail', validator: isValidEmail, invalidMsg: 'Enter a valid email address.' },
      { id: 'studentMobile', validator: isValidMobile, invalidMsg: 'Enter a valid 10-digit mobile number.' },
      { id: 'studentEmail', validator: isValidEmail, invalidMsg: 'Enter a valid email address.' },
      { id: 'emergencyAddress' },
      { id: 'emergencyTel' }
    ];

    function validateTextField(cfg) {
      const fieldEl = document.getElementById(`field-${cfg.id}`);
      const value = document.getElementById(cfg.id).value;
      if (!isFilled(value)) {
        setFieldError(fieldEl, 'This field is required.');
        return false;
      }
      if (cfg.validator && !cfg.validator(value)) {
        setFieldError(fieldEl, cfg.invalidMsg);
        return false;
      }
      setFieldError(fieldEl, '');
      return true;
    }

    function currentFields() {
      return {
        fatherName: document.getElementById('fatherName').value,
        motherName: document.getElementById('motherName').value,
        residenceAddress: {
          address: document.getElementById('resAddress').value,
          tel: document.getElementById('resTel').value,
          email: document.getElementById('resEmail').value
        },
        officeAddress: {
          address: document.getElementById('officeAddress').value,
          tel: document.getElementById('officeTel').value,
          email: document.getElementById('officeEmail').value
        },
        studentMobile: document.getElementById('studentMobile').value,
        studentEmail: document.getElementById('studentEmail').value,
        emergencyAddress: document.getElementById('emergencyAddress').value,
        emergencyTel: document.getElementById('emergencyTel').value
      };
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      saveDraftFields(currentFields());
      window.top.location.href = pageUrl('personal');
    });

    document.getElementById('step-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const ok = REQUIRED_FIELDS.map(validateTextField).every(Boolean);
      if (!ok) {
        showAlert(document.getElementById('alert-root'), {
          title: 'A few things need fixing',
          message: 'Check the highlighted fields below.',
          tone: 'danger'
        });
        document.querySelector('.field--invalid')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      saveDraftFields(currentFields());
      window.top.location.href = pageUrl('guardian');
    });
  </script>
</body>
</html>
