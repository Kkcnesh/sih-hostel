<!DOCTYPE html>
<!-- ==========================================================================
     LOGIN SCREEN
     ==========================================================================
     doGet(e) with no ?page= (or page=login) routes here. Entry point.

     Flow: EnrolmentNo + DOB -> loginStudent() -> on success, route to
     Application step 1 (no application yet) or Status (one exists) —
     see applicationEntryUrl() in JavaScript.html.
     ========================================================================== -->
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Login</title>
  <?!= include('Stylesheet') ?>
  <style>
    /* ---- page-specific: login ---- */
    .login-shell { display: flex; justify-content: center; padding-top: var(--space-6); }
    .login-panel { width: 100%; max-width: 480px; }
    .login-panel__title { font-size: var(--text-2xl); margin-top: var(--space-2); }
    .login-panel__subtitle { color: var(--text-muted); margin-top: 4px; margin-bottom: var(--space-2); }
    .help-line { text-align: center; font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-5); }
  </style>
</head>
<body>
  <script>const BASE_URL = '<?= baseUrl ?>';</script>

  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="login-shell">
        <div class="login-panel stack">
          <div class="panel">
            <div>
              <p class="eyebrow">Student Login</p>
              <h1 class="login-panel__title">Check your hostel status</h1>
              <p class="login-panel__subtitle">Sign in with the details on your admission record to apply for a hostel seat or track an existing application.</p>
            </div>

            <div id="alert-root"></div>

            <form id="login-form" class="stack" novalidate>
              <div class="field" id="field-enrolment">
                <label class="field__label" for="enrolmentNo">
                  Enrolment Number <span class="field__tag field__tag--required">Required</span>
                </label>
                <input class="field__control" type="text" id="enrolmentNo" name="enrolmentNo"
                       inputmode="numeric" placeholder="e.g. 05114802722" autocomplete="off">
                <p class="field__error"></p>
              </div>

              <div class="field" id="field-dob">
                <label class="field__label" for="dob">
                  Date of Birth <span class="field__tag field__tag--required">Required</span>
                </label>
                <input class="field__control" type="date" id="dob">
                <p class="field__error"></p>
              </div>

              <button type="submit" class="btn btn--primary btn--block" id="login-submit">
                Log In
              </button>
            </form>
          </div>

          <p class="help-line">Trouble logging in? Contact the Hostel Office with your enrolment number.</p>
        </div>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <?!= include('JavaScript') ?>
  <script>
    /* ---- page glue: wires the form to loginStudent() ---- */
    renderSiteHeader(document.getElementById('site-header'));
    renderSiteFooter(document.getElementById('site-footer'));

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit');
    const alertRoot = document.getElementById('alert-root');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      clearAlert(alertRoot);

      const enrolmentField = document.getElementById('field-enrolment');
      const dobField = document.getElementById('field-dob');
      const enrolmentNo = document.getElementById('enrolmentNo').value;
      const dob = document.getElementById('dob').value;

      let valid = true;
      if (!isValidEnrolment(enrolmentNo)) {
        setFieldError(enrolmentField, 'Enter your enrolment number as it appears on your admission letter.');
        valid = false;
      } else {
        setFieldError(enrolmentField, '');
      }
      if (!isFilled(dob)) {
        setFieldError(dobField, 'Enter your date of birth.');
        valid = false;
      } else {
        setFieldError(dobField, '');
      }
      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';

      google.script.run
        .withSuccessHandler((result) => {
          if (!result.success) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
            showAlert(alertRoot, { title: 'We couldn’t log you in', message: result.error, tone: 'danger' });
            return;
          }
          setSession({ ...result.student, hasExistingApplication: result.hasExistingApplication, applicationId: result.applicationId });
          window.top.location.href = applicationEntryUrl(getSession());
        })
        .withFailureHandler((error) => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          showAlert(alertRoot, { title: 'Something went wrong', message: 'Please try again in a moment.', tone: 'danger' });
          console.error(error);
        })
        .loginStudent(enrolmentNo, dob);
    });
  </script>
</body>
</html>
