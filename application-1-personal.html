<!DOCTYPE html>
<!-- ==========================================================================
     APPLICATION — STEP 1: PERSONAL & ACADEMIC DETAILS
     ==========================================================================
     First of six application step pages (see APPLICATION_STEPS in script.js
     for the full list). Fields are based on the GGSIPU Hostel Application
     Form (Annexure-I). Answers are written to the shared "draft" object
     (see saveDraftFields() in script.js) and only turn into a real
     Applications row when step 6 (Review & Submit) succeeds.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Application: Personal Details</title>
  <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">
        <p class="eyebrow">Hostel Application &middot; Step 1 of 6</p>
        <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Personal &amp; Academic Details</h1>

        <div id="step-nav" class="step-nav"></div>
        <div id="alert-root"></div>

        <form id="step-form" class="panel" novalidate>
          <div class="field-row">
            <div class="field" id="field-fullName">
              <label class="field__label" for="fullName">Full Name <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="fullName">
              <p class="field__error"></p>
            </div>
            <div class="field" id="field-nationality">
              <label class="field__label" for="nationality">Nationality <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="nationality" value="Indian">
              <p class="field__error"></p>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__label" for="dob">Date of Birth <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="date" id="dob" disabled>
              <p class="field__help">From your admission record</p>
            </div>
            <div class="field">
              <label class="field__label" for="enrolmentNo">Enrolment No. <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="enrolmentNo" disabled>
              <p class="field__help">From your admission record</p>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label class="field__label" for="courseSchool">Course &amp; School of Study <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="text" id="courseSchool" disabled>
              <p class="field__help">Incorrect? Contact the Hostel Office.</p>
            </div>
            <div class="field" id="field-dateOfJoining">
              <label class="field__label" for="dateOfJoining">Date of Joining University <span class="field__tag field__tag--required">Required</span></label>
              <input class="field__control" type="date" id="dateOfJoining">
              <p class="field__error"></p>
            </div>
          </div>

          <fieldset class="field" id="field-category">
            <legend class="field__label">Category <span class="field__tag field__tag--required">Required</span></legend>
            <div class="radio-group">
              <label class="radio-option"><input type="radio" name="category" value="Delhi"> Delhi</label>
              <label class="radio-option"><input type="radio" name="category" value="Outside Delhi"> Outside Delhi</label>
              <label class="radio-option"><input type="radio" name="category" value="Transferred"> Transferred</label>
            </div>
            <p class="field__error"></p>
          </fieldset>

          <div class="field-row">
            <div class="field" id="field-reservationCategory">
              <label class="field__label" for="reservationCategory">Reservation Category <span class="field__tag field__tag--required">Required</span></label>
              <select class="field__control" id="reservationCategory">
                <option value="" selected>Select category</option>
                <option value="GEN">General (GEN)</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="PH">PH</option>
              </select>
              <p class="field__error"></p>
            </div>
            <div></div>
          </div>

          <div class="field">
            <label class="field__label" for="extraCurricular">Extra-Curricular Activities <span class="field__tag field__tag--optional">Optional</span></label>
            <textarea class="field__control" id="extraCurricular" rows="2" placeholder="Sports, societies, clubs, competitions…"></textarea>
          </div>

          <div class="btn-row">
            <span></span>
            <button type="submit" class="btn btn--primary" id="next-btn">Next: Family &amp; Contact Details</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/script.js"></script>
  <script>
    const student = requireSession();
    if (student) {
      if (getApplicationRecord(student.EnrolmentNo)) {
        window.location.href = 'status.html';
      }

      renderSiteHeader(document.getElementById('site-header'), { activeNav: 'apply' });
      renderSiteFooter(document.getElementById('site-footer'));
      renderStepNav(document.getElementById('step-nav'), 'personal');

      document.getElementById('dob').value = student.DOB;
      document.getElementById('enrolmentNo').value = student.EnrolmentNo;
      document.getElementById('courseSchool').value = `${student.Course} — ${student.School}`;

      // Resume from a saved draft if the student came back to edit this step.
      const draft = getDraft() || {};
      document.getElementById('fullName').value = draft.name ?? student.Name;
      document.getElementById('nationality').value = draft.nationality ?? 'Indian';
      document.getElementById('dateOfJoining').value = draft.dateOfJoining ?? '';
      document.getElementById('extraCurricular').value = draft.extraCurricular ?? '';
      if (draft.category) {
        const el = document.querySelector(`input[name="category"][value="${draft.category}"]`);
        if (el) el.checked = true;
      }
      if (draft.reservationCategory) {
        document.getElementById('reservationCategory').value = draft.reservationCategory;
      }
    }

    const REQUIRED_FIELDS = [
      { id: 'fullName' },
      { id: 'nationality' },
      { id: 'dateOfJoining' }
    ];

    function validateTextField(cfg) {
      const fieldEl = document.getElementById(`field-${cfg.id}`);
      const value = document.getElementById(cfg.id).value;
      if (!isFilled(value)) {
        setFieldError(fieldEl, 'This field is required.');
        return false;
      }
      setFieldError(fieldEl, '');
      return true;
    }

    function validateRadioGroup(name) {
      const fieldEl = document.getElementById(`field-${name}`);
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      setFieldError(fieldEl, checked ? '' : 'Please select one option.');
      return !!checked;
    }

    function validateSelect(id) {
      const fieldEl = document.getElementById(`field-${id}`);
      const value = document.getElementById(id).value;
      setFieldError(fieldEl, value ? '' : 'Please select an option.');
      return !!value;
    }

    document.getElementById('step-form').addEventListener('submit', (e) => {
      e.preventDefault();

      const textOk = REQUIRED_FIELDS.map(validateTextField).every(Boolean);
      const categoryOk = validateRadioGroup('category');
      const reservationOk = validateSelect('reservationCategory');

      if (!(textOk && categoryOk && reservationOk)) {
        showAlert(document.getElementById('alert-root'), {
          title: 'A few things need fixing',
          message: 'Check the highlighted fields below.',
          tone: 'danger'
        });
        document.querySelector('.field--invalid')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      saveDraftFields({
        name: document.getElementById('fullName').value,
        nationality: document.getElementById('nationality').value,
        dob: student.DOB,
        courseSchool: document.getElementById('courseSchool').value,
        dateOfJoining: document.getElementById('dateOfJoining').value,
        category: document.querySelector('input[name="category"]:checked').value,
        reservationCategory: document.getElementById('reservationCategory').value,
        extraCurricular: document.getElementById('extraCurricular').value
      });

      window.location.href = 'application-2-family.html';
    });
  </script>
</body>
</html>
