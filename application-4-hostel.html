<!DOCTYPE html>
<!-- ==========================================================================
     APPLICATION — STEP 4: HOSTEL PREFERENCES
     ==========================================================================
     The hostel-specific fields this project adds on top of the paper
     Annexure-I form — not derived from it.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Application: Hostel Preferences</title>
  <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">
        <p class="eyebrow">Hostel Application &middot; Step 4 of 6</p>
        <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Hostel Preferences</h1>

        <div id="step-nav" class="step-nav"></div>
        <div id="alert-root"></div>

        <form id="step-form" class="panel" novalidate>
          <fieldset class="field" id="field-hostel">
            <legend class="field__label">Hostel <span class="field__tag field__tag--required">Required</span></legend>
            <div class="choice-group">
              <label class="choice-card">
                <input type="radio" name="hostel" value="Boys">
                <span class="choice-card__body">
                  <span class="choice-card__label">Boys Hostel</span>
                  <span class="choice-card__meta">Block B, Dwarka Campus</span>
                </span>
              </label>
              <label class="choice-card">
                <input type="radio" name="hostel" value="Girls">
                <span class="choice-card__body">
                  <span class="choice-card__label">Girls Hostel</span>
                  <span class="choice-card__meta">Block A, Dwarka Campus</span>
                </span>
              </label>
            </div>
            <p class="field__error"></p>
          </fieldset>

          <fieldset class="field" id="field-roomType">
            <legend class="field__label">Room Type Preference <span class="field__tag field__tag--required">Required</span></legend>
            <div class="choice-group">
              <label class="choice-card">
                <input type="radio" name="roomType" value="Triple-sharing">
                <span class="choice-card__body">
                  <span class="choice-card__label">Triple-sharing</span>
                  <span class="choice-card__meta">3 students / room</span>
                </span>
              </label>
              <label class="choice-card">
                <input type="radio" name="roomType" value="4-sharing">
                <span class="choice-card__body">
                  <span class="choice-card__label">4-sharing</span>
                  <span class="choice-card__meta">4 students / room</span>
                </span>
              </label>
            </div>
            <p class="field__error"></p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="roommateEnrolment">Roommate Preference <span class="field__tag field__tag--optional">Optional</span></label>
            <input class="field__control" type="text" id="roommateEnrolment" inputmode="numeric" placeholder="Friend's enrolment number">
            <p class="field__help">If your friend also lists you, we'll try to seat you together. This isn't guaranteed — it depends on room availability.</p>
          </div>

          <div class="btn-row">
            <button type="button" class="btn btn--secondary" id="back-btn">Back</button>
            <button type="submit" class="btn btn--primary" id="next-btn">Next: Documents</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/script.js"></script>
  <script>
    const student = requireSession();
    let draft;
    if (student) {
      if (getApplicationRecord(student.EnrolmentNo)) window.location.href = 'status.html';
      draft = requireDraft();
    }

    if (student && draft) {
      renderSiteHeader(document.getElementById('site-header'), { activeNav: 'apply' });
      renderSiteFooter(document.getElementById('site-footer'));
      renderStepNav(document.getElementById('step-nav'), 'hostel');

      // Sensible default for a gender-segregated hostel system — still changeable.
      const defaultHostel = draft.hostel ?? (student.Gender === 'Female' ? 'Girls' : 'Boys');
      const defaultHostelInput = document.querySelector(`input[name="hostel"][value="${defaultHostel}"]`);
      if (defaultHostelInput) defaultHostelInput.checked = true;

      if (draft.roomType) {
        const el = document.querySelector(`input[name="roomType"][value="${draft.roomType}"]`);
        if (el) el.checked = true;
      }
      document.getElementById('roommateEnrolment').value = draft.roommateEnrolment ?? '';
    }

    function validateRadioGroup(name) {
      const fieldEl = document.getElementById(`field-${name}`);
      const checked = document.querySelector(`input[name="${name}"]:checked`);
      setFieldError(fieldEl, checked ? '' : 'Please select one option.');
      return !!checked;
    }

    function currentFields() {
      return {
        hostel: document.querySelector('input[name="hostel"]:checked')?.value ?? '',
        roomType: document.querySelector('input[name="roomType"]:checked')?.value ?? '',
        roommateEnrolment: document.getElementById('roommateEnrolment').value
      };
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      saveDraftFields(currentFields());
      window.location.href = 'application-3-guardian.html';
    });

    document.getElementById('step-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const hostelOk = validateRadioGroup('hostel');
      const roomTypeOk = validateRadioGroup('roomType');
      if (!(hostelOk && roomTypeOk)) {
        showAlert(document.getElementById('alert-root'), {
          title: 'A few things need fixing',
          message: 'Check the highlighted fields below.',
          tone: 'danger'
        });
        document.querySelector('.field--invalid')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      saveDraftFields(currentFields());
      window.location.href = 'application-5-documents.html';
    });
  </script>
</body>
</html>
