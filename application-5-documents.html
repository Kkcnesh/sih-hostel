<!DOCTYPE html>
<!-- ==========================================================================
     APPLICATION — STEP 5: DOCUMENTS
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Application: Documents</title>
  <link rel="stylesheet" href="css/stylesheet.css">
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">
        <p class="eyebrow">Hostel Application &middot; Step 5 of 6</p>
        <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Documents</h1>

        <div id="step-nav" class="step-nav"></div>
        <div id="alert-root"></div>

        <form id="step-form" class="panel" novalidate>
          <p class="panel__hint" style="margin-top: -8px;">Accepted formats: JPG, PNG or PDF, up to 5 MB each.</p>
          <div class="stack" id="documents-container"><!-- populated by renderUploaders() --></div>

          <div class="btn-row">
            <button type="button" class="btn btn--secondary" id="back-btn">Back</button>
            <button type="submit" class="btn btn--primary" id="next-btn" disabled>Next: Review &amp; Submit</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/script.js"></script>
  <script>
    const student = requireSession();
    let draft;
    if (student) {
      if (getApplicationRecord(student.EnrolmentNo)) window.location.href = 'status.html';
      draft = requireDraft();
    }

    let uploaders;
    if (student && draft) {
      renderSiteHeader(document.getElementById('site-header'), { activeNav: 'apply' });
      renderSiteFooter(document.getElementById('site-footer'));
      renderStepNav(document.getElementById('step-nav'), 'documents');

      uploaders = renderUploaders(document.getElementById('documents-container'), updateNextState, draft.documents || {});
      updateNextState();
    }

    const nextBtn = document.getElementById('next-btn');
    function updateNextState() {
      nextBtn.disabled = !uploaders.allRequiredDone();
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      saveDraftFields({ documents: uploaders.getState() });
      window.location.href = 'application-4-hostel.html';
    });

    document.getElementById('step-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!uploaders.allRequiredDone()) {
        showAlert(document.getElementById('alert-root'), {
          title: 'A few documents are still missing',
          message: 'Every required document needs to show a green check before you continue.',
          tone: 'danger'
        });
        return;
      }
      saveDraftFields({ documents: uploaders.getState() });
      window.location.href = 'application-6-review.html';
    });
  </script>
</body>
</html>
