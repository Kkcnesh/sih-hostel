<!DOCTYPE html>
<!-- ==========================================================================
     APPLICATION — STEP 6: REVIEW & SUBMIT
     ==========================================================================
     Reads the full draft assembled across steps 1–5, shows it back for a
     final check (with an Edit link per section back to that step), and on
     submit is the one page that actually calls Server.submitApplication().

     TODO(backend): once the allocation engine exists, this is the hand-off
     point — the record written here is the row it will read from.
     ========================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Application: Review &amp; Submit</title>
  <link rel="stylesheet" href="css/stylesheet.css">
  <style>
    #confirm-view.hidden, #review-view.hidden { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">

        <div id="review-view">
          <p class="eyebrow">Hostel Application &middot; Step 6 of 6</p>
          <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Review &amp; Submit</h1>

          <div id="step-nav" class="step-nav"></div>
          <div id="alert-root"></div>

          <div class="stack" id="review-container"><!-- populated by renderReview() --></div>

          <div class="btn-row" style="margin-top: var(--space-5);">
            <button type="button" class="btn btn--secondary" id="back-btn">Back</button>
            <button type="button" class="btn btn--primary" id="submit-btn">Submit Application</button>
          </div>
        </div>

        <div id="confirm-view" class="hidden">
          <div class="panel confirm-panel">
            <div class="confirm-panel__badge">
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M6 14.5L11.5 20L22 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <p class="eyebrow">Application Submitted</p>
            <h1 style="font-size: var(--text-2xl);">You're on the list</h1>
            <p class="text-muted">Keep this reference number — you'll need it if you contact the Hostel Office.</p>
            <div class="confirm-panel__ref" id="confirm-ref"></div>
            <a href="status.html" class="btn btn--primary" style="margin-top: var(--space-3);">Track your application</a>
          </div>
        </div>

      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/script.js"></script>
  <script>
    const student = requireSession();
    let draft;
    if (student) {
      if (getApplicationRecord(student.EnrolmentNo)) window.location.href = 'status.html';
      draft = requireDraft();
    }

    function field(label, value, full = false) {
      return `
        <div class="review-item${full ? ' review-item--full' : ''}">
          <div class="review-item__label">${label}</div>
          <div class="review-item__value">${value && String(value).trim() ? value : '—'}</div>
        </div>`;
    }

    function block(title, editPage, bodyHtml) {
      return `
        <div class="review-block">
          <div class="review-block__header">
            <span class="review-block__title">${title}</span>
            <a href="${editPage}" class="btn btn--ghost btn--sm">Edit</a>
          </div>
          <div class="review-block__body">${bodyHtml}</div>
        </div>`;
    }

    function renderReview() {
      const d = draft;
      const container = document.getElementById('review-container');

      const personal = block('Personal & Academic Details', 'application-1-personal.html', [
        field('Full Name', d.name),
        field('Nationality', d.nationality),
        field('Date of Birth', formatDateDisplay(d.dob)),
        field('Enrolment No.', student.EnrolmentNo),
        field('Course & School', d.courseSchool, true),
        field('Date of Joining University', d.dateOfJoining ? formatDateDisplay(d.dateOfJoining) : ''),
        field('Category', d.category),
        field('Reservation Category', d.reservationCategory),
        field('Extra-Curricular Activities', d.extraCurricular, true)
      ].join(''));

      const family = block('Family & Contact Details', 'application-2-family.html', [
        field("Father's Name", d.fatherName),
        field("Mother's Name", d.motherName),
        field('Residence Address', d.residenceAddress?.address, true),
        field('Residence Tel.', d.residenceAddress?.tel),
        field('Residence Email', d.residenceAddress?.email),
        field('Office Address', d.officeAddress?.address, true),
        field('Your Mobile', d.studentMobile),
        field('Your Email', d.studentEmail),
        field('Emergency Contact Address', d.emergencyAddress, true)
      ].join(''));

      const guardian = block('Local Guardian Details', 'application-3-guardian.html', [
        field('Residence Address', d.localGuardian?.residence?.address, true),
        field('Residence Tel.', d.localGuardian?.residence?.tel),
        field('Residence Email', d.localGuardian?.residence?.email),
        field('Office Address', d.localGuardian?.office?.address, true),
        field('Office Tel.', d.localGuardian?.office?.tel),
        field('Office Email', d.localGuardian?.office?.email)
      ].join(''));

      const hostel = block('Hostel Preferences', 'application-4-hostel.html', [
        field('Hostel', d.hostel),
        field('Room Type', d.roomType),
        field('Roommate Preference', d.roommateEnrolment)
      ].join(''));

      const docList = DOCUMENT_CONFIG.map((cfg) => {
        const entry = d.documents?.[cfg.key];
        const summary = entry?.done
          ? (entry.files.length > 1 ? `${entry.files.length} files` : entry.files[0]?.name)
          : 'Not submitted';
        return field(cfg.label, summary);
      }).join('');
      const documents = block('Documents', 'application-5-documents.html', docList);

      container.innerHTML = personal + family + guardian + hostel + documents;
    }

    if (student && draft) {
      renderSiteHeader(document.getElementById('site-header'), { activeNav: 'apply' });
      renderSiteFooter(document.getElementById('site-footer'));
      renderStepNav(document.getElementById('step-nav'), 'review');
      renderReview();
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      window.location.href = 'application-5-documents.html';
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';

      const applicationData = { ...draft, enrolmentNo: student.EnrolmentNo };

      Server.submitApplication(applicationData,
        (result) => {
          clearDraft();
          document.getElementById('review-view').classList.add('hidden');
          document.getElementById('confirm-view').classList.remove('hidden');
          document.getElementById('confirm-ref').textContent = result.referenceNo;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        () => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Application';
          showAlert(document.getElementById('alert-root'), {
            title: 'Submission failed',
            message: 'Something went wrong sending your application. Please try again.',
            tone: 'danger'
          });
        }
      );
    });
  </script>
</body>
</html>
