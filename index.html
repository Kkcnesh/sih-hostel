<!DOCTYPE html>
<!-- ==========================================================================
     LOGIN SCREEN
     ==========================================================================
     Entry point — served as the site's index.html.

     Flow: EnrolmentNo + DOB -> POST /api/login -> on success, show a real
     link to Application (no application yet) or Status (one exists) — see
     applicationEntryUrl() in js/script.js.
     ========================================================================== -->
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Login</title>
  <link rel="stylesheet" href="css/stylesheet.css">
  <style>
    /* ---- page-specific: login ---- */
    .login-shell { display: flex; justify-content: center; padding-top: var(--space-6); }
    .login-panel { width: 100%; max-width: 480px; }
    .login-panel__title { font-size: var(--text-2xl); margin-top: var(--space-2); }
    .login-panel__subtitle { color: var(--text-muted); margin-top: 4px; margin-bottom: var(--space-2); }
    .help-line { text-align: center; font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-5); }
    #login-submit {
  margin-top: 18px;
}
    #welcome-view.hidden, #login-view.hidden { display: none; }
  </style>
  <style>
    /* Background photo — matches admin.html's same treatment. */
    body {
      background-image: url("assets/usarbg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="login-shell">
        <div class="login-panel stack">

          <div id="login-view" class="panel">
            <div>
              <p class="eyebrow">Student Login</p>
              <h1 class="login-panel__title">Check your hostel status</h1>
              <p class="login-panel__subtitle">Sign in with the details on your admission record to apply for a hostel seat or track an existing application.</p>
            </div>

            <div id="alert-root"></div>

            <!-- Deliberately a <div>, not a <form> — no <form> element means
                 there is nothing for the browser to natively submit, ever,
                 regardless of Enter-key handling, event-listener timing, or
                 any other edge case. See the header note in js/script.js. -->
            <div id="login-form" class="stack">
              <div class="field" id="field-enrolment">
                <label class="field__label" for="enrolmentNo">
                  Enrolment Number <span class="field__required">*</span>
                </label>
                <input class="field__control"
       type="text"
       id="enrolmentNo"
       name="enrolmentNo"
       inputmode="numeric"
       placeholder="e.g. 05114802722"
       autocomplete="off">
                <p class="field__error"></p>
              </div>

              <div class="field" id="field-dob">
                <label class="field__label" for="dob">
                  Date of Birth <span class="field__required">*</span>
                </label>
                <input class="field__control" type="date" id="dob">
                <p class="field__error"></p>
              </div>

              <button type="button" class="btn btn--primary btn--block" id="login-submit">
                Log In
              </button>
            </div>
          </div>

          <div id="welcome-view" class="panel hidden" style="text-align:center;">
            <div class="confirm-panel__badge" style="margin: 0 auto;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L10 17.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <p class="eyebrow" style="margin-top: var(--space-3);">Signed In</p>
            <h1 class="login-panel__title" id="welcome-name" style="font-size: var(--text-xl);"></h1>
            <p class="login-panel__subtitle" id="welcome-message"></p>
            <a id="welcome-link" href="#" class="btn btn--primary btn--block" style="margin-top: var(--space-3);"></a>
          </div>

          <p class="help-line">Trouble logging in? Contact the Hostel Office with your enrolment number.</p>
        </div>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/script.js"></script>
  <script>
    /* ---- page glue: wires the form to POST /api/login ---- */
    renderSiteHeader(document.getElementById('site-header'), { activeNav: 'login' });
    renderSiteFooter(document.getElementById('site-footer'));

    const submitBtn = document.getElementById('login-submit');
    const alertRoot = document.getElementById('alert-root');
    const enrolmentInput = document.getElementById('enrolmentNo');
    const dobInput = document.getElementById('dob');
    

    function attemptLogin() {
      const enrolmentField = document.getElementById('field-enrolment');
      const dobField = document.getElementById('field-dob');
      const enrolmentNo = document.getElementById('enrolmentNo').value;
      const dob = document.getElementById('dob').value;

      let valid = true;
      if (!isValidEnrolment(enrolmentNo)) {
        setFieldError(enrolmentField, 'Enter your enrolment number as it appears on your admission letter.');
        valid = false;
      } else {
        setFieldError(enrolmentField, '');
      }
      if (!isFilled(dob)) {
        setFieldError(dobField, 'Enter your date of birth.');
        valid = false;
      } else {
        setFieldError(dobField, '');
      }
      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking…';

      callApi('login', { enrolmentNo, dob })
        .then((result) => {
          if (!result.success) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Log In';
            showAlert(alertRoot, { title: 'We couldn’t log you in', message: result.error, tone: 'danger' });
            return;
          }

          const student = { ...result.student, hasExistingApplication: result.hasExistingApplication, applicationId: result.applicationId };
          setSession(student);

          const link = document.getElementById('welcome-link');
          if (student.hasExistingApplication) {
            link.href = pageUrl('status');
            link.textContent = 'Go to your application status';
            document.getElementById('welcome-message').textContent = 'You already have an application on file.';
          } else {
            link.href = pageUrl('application');
            link.textContent = 'Start your hostel application';
            document.getElementById('welcome-message').textContent = 'Sign-in successful — you can apply for a hostel seat now.';
          }
          document.getElementById('welcome-name').textContent = `Welcome, ${student.Name}`;
          document.getElementById('login-view').classList.add('hidden');
          document.getElementById('welcome-view').classList.remove('hidden');
        })
        .catch((error) => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In';
          showAlert(alertRoot, { title: 'Something went wrong', message: 'Please try again in a moment.', tone: 'danger' });
          console.error(error);
        });
    }

    submitBtn.addEventListener('click', attemptLogin);
    [enrolmentInput, dobInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault(); // date inputs otherwise open their picker on Enter
          attemptLogin();
        }
      });
    });
  </script>
</body>
</html>
