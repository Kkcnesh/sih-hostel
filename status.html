<!DOCTYPE html>
<!-- ==========================================================================
     STATUS TRACKER
     ==========================================================================
     Requires a session — for a logged-in student who already has an
     Applications row (student.hasExistingApplication).

     GET status via POST /api/getApplicationStatus, which returns two
     separate columns — VerificationStatus ("Pending" | "Verified", set by
     the not-yet-built admin dashboard) and AllotmentStatus ("Not
     Processed" | "Allotted" | "Waitlisted", set by the not-yet-built
     allocation engine). This page derives its 3-stage corridor display
     from both — see deriveCorridorStatus() below.
     ========================================================================== -->
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGSIPU Hostel Portal — Status</title>
  <link rel="stylesheet" href="css/stylesheet.css">
  <style>
    .corridor-status-line { text-align: center; font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-4); }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header" id="site-header"></header>

    <main>
      <div class="container container--narrow">
        <p class="eyebrow">Application Status</p>
        <h1 style="font-size: var(--text-2xl); margin: 4px 0 var(--space-5);">Where things stand</h1>

        <div id="status-root" class="stack"><!-- populated by JS --></div>
      </div>
    </main>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="js/script.js"></script>
  <script>
    /* ==========================================================================
       PAGE GLUE — Status tracker
       ========================================================================== */
    const student = requireSession();
    const statusRoot = document.getElementById('status-root');

    renderSiteHeader(document.getElementById('site-header'), { activeNav: 'status' });
    renderSiteFooter(document.getElementById('site-footer'));

    if (!student) {
      renderGatePanel(statusRoot, {
        title: 'Please log in first',
        message: 'You need to sign in to see your application status.',
        linkHref: pageUrl('login'),
        linkLabel: 'Go to Login'
      });
    } else {
      callApi('getApplicationStatus', { enrolmentNo: student.EnrolmentNo })
        .then((result) => {
          if (!result.success) {
            renderEmptyState();
            return;
          }
          renderStatus(result.application);
        })
        .catch((error) => {
          renderEmptyState();
          console.error(error);
        });
    }

    function renderEmptyState() {
      statusRoot.innerHTML = `
        <div class="panel empty-state">
          <div class="empty-state__icon">${icon('doc')}</div>
          <h2 style="font-size: var(--text-lg);">No application yet</h2>
          <p class="text-muted" style="margin-top: 4px;">You haven't submitted a hostel application. Fill it in to get a reference number and start tracking.</p>
          <a href="${pageUrl('application')}" class="btn btn--primary" style="margin-top: var(--space-4);">Start application</a>
        </div>
      `;
    }

    /** VerificationStatus + AllotmentStatus (two sheet columns) -> the corridor's single stage key. */
    function deriveCorridorStatus(app) {
      if (app.allotmentStatus === 'Allotted') return 'allotted';
      if (app.allotmentStatus === 'Waitlisted') return 'waitlisted';
      if (app.verificationStatus === 'Pending') return 'submitted';
      return 'verification';
    }

    function renderStatus(app) {
      const statusKey = deriveCorridorStatus(app);

      const stageLine = {
        submitted: 'Your application has been received and is queued for verification.',
        verification: 'The Hostel Office is verifying your documents. This usually takes a few working days.',
        allotted: 'A room has been allotted — details below.',
        waitlisted: 'All seats matching your preference are full for now — you are on the waitlist.'
      }[statusKey];

      statusRoot.innerHTML = `
        <section class="panel">
          <div class="summary-grid">
            <div>
              <p class="summary-grid__label">Reference No.</p>
              <p class="summary-grid__value">${app.applicationId}</p>
            </div>
            <div>
              <p class="summary-grid__label">Submitted On</p>
              <p class="summary-grid__value">${formatDateDisplay(app.submittedDate)}</p>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="corridor" id="corridor"></div>
          <p class="corridor-status-line">${stageLine}</p>
        </section>

        <section class="panel">
          <h2 class="panel__title" style="font-size: var(--text-base);">Documents Submitted</h2>
          <div class="checklist" id="doc-checklist"></div>
        </section>

        <div id="result-slot"></div>
      `;

      renderCorridor(document.getElementById('corridor'), statusKey);
      renderDocChecklist(app.documents || {});
      renderResultCard(app, statusKey);
    }

    function renderDocChecklist(documents) {
      const listEl = document.getElementById('doc-checklist');
      listEl.innerHTML = DOCUMENT_CONFIG.map((cfg) => {
        const entry = documents[cfg.key];
        const fileSummary = entry?.files?.length
          ? (entry.files.length > 1 ? `${entry.files.length} files` : entry.files[0].name)
          : 'Not submitted';
        return `
          <div class="checklist__item">
            <div class="checklist__icon">${icon('check')}</div>
            <div class="checklist__label">${cfg.label}</div>
            <div class="checklist__meta">${fileSummary}</div>
          </div>
        `;
      }).join('');
    }

    function renderResultCard(app, statusKey) {
      const slot = document.getElementById('result-slot');

      if (statusKey === 'allotted') {
        slot.innerHTML = `
          <section class="panel result-card result-card--allotted">
            <h2 class="panel__title" style="font-size: var(--text-base);">You're allotted a room</h2>
            <div class="result-card__grid">
              <div>
                <p class="result-card__stat-label">Hostel</p>
                <p class="result-card__stat-value">${app.hostel} Hostel</p>
              </div>
              <div>
                <p class="result-card__stat-label">Room No.</p>
                <p class="result-card__stat-value">${app.allottedRoomNo}</p>
              </div>
              <div style="grid-column: 1 / -1;">
                <p class="result-card__stat-label">Roommate</p>
                <p class="result-card__stat-value">${app.allottedRoommateEnrolmentNo || 'Not yet assigned'}</p>
              </div>
            </div>
          </section>
        `;
      } else if (statusKey === 'waitlisted') {
        slot.innerHTML = `
          <section class="panel result-card result-card--waitlisted">
            <h2 class="panel__title" style="font-size: var(--text-base);">You're on the waitlist</h2>
            ${app.waitlistPosition
              ? `<div><p class="result-card__stat-label">Waitlist Position</p><p class="result-card__stat-value">#${app.waitlistPosition}</p></div>`
              : `<p class="text-muted">Your position will appear here once seats are finalised.</p>`}
          </section>
        `;
      } else {
        slot.innerHTML = '';
      }
    }
  </script>
</body>
</html>
